[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-to-act"
version = "0.1.0"
description = "Phase 1 Excel decomposition framework for actuarial model migration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pydantic>=2",
  "typer>=0.12",
]

# License-sensitive extras are kept separate: never bundle EUPL/GPL-ish packages
# with permissive ones behind a single opt-in (see docs/design/decision_default_dependency_licenses.md).
[project.optional-dependencies]
vba = [
  "oletools>=0.60.2",  # BSD-3; olevba extracts xl/vbaProject.bin, XLM, DDE
]
oracle-formulas = [
  "formulas>=1.3",  # EUPL-1.2: isolated, explicit opt-in only
]
xlcalc = [
  "xlcalculator>=0.5",  # MIT
]
report = [
  "jinja2>=3",
  "xlsxwriter>=3",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1",
]

[project.scripts]
excel-to-act = "excel_to_act.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"excel_to_act.steps.step1" = ["agent.md"]
"excel_to_act.steps.step2" = ["agent.md"]
"excel_to_act.steps.step3" = ["agent.md"]
"excel_to_act.steps.step4" = ["agent.md"]
"excel_to_act.steps.step5" = ["agent.md", "native_excel_oracle.ps1"]
"excel_to_act.steps.step6" = [
  "agent.md",
  "excel-to-act-step6/SKILL.md",
  "excel-to-act-step6/assets/conversion_report.md",
  "excel-to-act-step6/agents/openai.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
